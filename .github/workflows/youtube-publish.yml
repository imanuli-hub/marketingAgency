name: YouTube publish

# Uploads approved, QC-passed episodes as private + scheduled (publishAt),
# then verifies that published ones went public. Idempotent: see src/youtube/publish.ts.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload)"
        type: boolean
        default: true
  schedule:
    - cron: "17 */2 * * *" # every 2 hours

concurrency:
  group: youtube-publish # never two publishers at once (duplicate-upload guard)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: channel-state # episode state lives here; main holds code only
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run -s yt:publish -- --dry-run
          else
            npm run -s yt:publish
          fi
      - name: Save manifest updates
        if: always()
        run: |
          git config user.name "tie-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add channels/*/queue
          git diff --cached --quiet || (git commit -m "publish: update episode manifests" && git push origin HEAD:channel-state)
